  <style>
    /* Gate styles are scoped to #gate: the decrypted page brings its own CSS
       and replaces everything inside <body>. */
    html { -webkit-text-size-adjust: 100% }
    body { margin: 0; background: #f6f8fb; color: #151b24;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }

    #gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      background: repeating-conic-gradient(from 0deg at 50% 40%, transparent 0 3.2deg, rgba(21, 27, 36, .06) 3.2deg 4deg) }
    #gate * { box-sizing: border-box }
    #gate .card { width: 100%; max-width: 400px; background: #fff; border: 3px solid #151b24;
      box-shadow: 6px 6px 0 #151b24; padding: 26px 24px }
    #gate .brand { display: inline-block; background: #f6cf57; border: 2px solid #151b24; padding: 1px 8px;
      font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase }
    #gate h1 { font-weight: 900; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 14px 0 8px }
    #gate .sub { font-size: 14.5px; line-height: 1.55; color: #56606c; margin: 0 0 20px }
    #gate label { display: block; margin: 0 0 14px }
    #gate label span { display: block; font-weight: 800; font-size: 12px; letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 6px }
    /* 16px keeps iOS Safari from zooming the viewport on focus */
    #gate input { width: 100%; font: inherit; font-size: 16px; color: #151b24; background: #fff;
      border: 2px solid #151b24; border-radius: 0; padding: 12px; min-height: 48px }
    #gate input:focus-visible, #gate button:focus-visible { outline: 3px solid #2a7f86; outline-offset: 2px }
    #gate button { width: 100%; min-height: 50px; margin-top: 6px; border: 3px solid #151b24; background: #3a6ea5;
      color: #fff; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 3px 3px 0 #151b24 }
    #gate button[disabled] { opacity: .6; cursor: progress }
    #gate #msg { min-height: 20px; margin: 14px 0 0; font-size: 13px; font-weight: 600; color: #56606c }
    #gate #msg.err { color: #a3352c }
    #gate .foot { margin: 18px 0 0; padding-top: 14px; border-top: 2px solid #e8edf3; font-size: 11.5px;
      line-height: 1.7; color: #56606c }
    #gate .foot a { color: #151b24 }
  </style>
</head>

    <form class="card" id="form" autocomplete="on">
      <span class="brand">Rule book</span>
      <h1>This one's private</h1>
      <p class="sub">The page is stored encrypted. Your username and password derive the key that unlocks it, and the
        same key signs you in to your saved progress.</p>

      <label>
        <span>Username</span>
        <input type="text" id="user" name="username" autocomplete="username" autocapitalize="off" autocorrect="off"
          spellcheck="false" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="pass" name="password" autocomplete="current-password" required />
      </label>

      <button type="submit" id="unlock">Unlock</button>
      <p id="msg" role="status" aria-live="polite"></p>

      <p class="foot">
        AES-256-GCM · PBKDF2-SHA256 · 2,000,000 iterations<br />
        <a href="/">← back to bhargavmantha.dev</a>
      </p>
    </form>
  </main>

        var bin = atob(s), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;

      async function deriveKey(user, pass) {
        var material = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(user.trim().toLowerCase() + '\n' + pass),
          'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(P.salt), iterations: P.iterations, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      }

      async function decrypt(key) {
        var plain = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
        return new TextDecoder().decode(plain);
      }

      // The progress API token is SHA-256("dojo-api-token\n" + raw key), hex.
      // The server only ever holds a hash of it (see scripts/encrypt-dojo.mjs).
      async function apiToken(key) {
        var raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        var pre = new TextEncoder().encode('dojo-api-token\n');
        var buf = new Uint8Array(pre.length + raw.length);
        buf.set(pre); buf.set(raw, pre.length);
        var digest = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
        var hex = '';
        for (var i = 0; i < digest.length; i++) hex += ('0' + digest[i].toString(16)).slice(-2);
        return hex;
      }

var S=load();
var writer=null,ref=null,writing=false,dirty=false,timer=null;
var API=(window.DOJO&&window.DOJO.token)?{url:"/.netlify/functions/dojo-progress",auth:"Bearer "+window.DOJO.token}:null;
function keepLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function save(){ S.t=Date.now(); keepLocal(); queueRemote(); }
function setSync(m){ var el=document.getElementById("sync"); if(el) el.textContent=m; }
function queueRemote(){ if(!writer) return; dirty=true; clearTimeout(timer); timer=setTimeout(flush,900); }
function flush(){
  if(!writer||writing||!dirty) return;
  writing=true; dirty=false; setSync("Saving…");
  writer(JSON.parse(JSON.stringify(S))).then(function(){ setSync("Saved"); },function(){ setSync("Saved in this browser only"); })
    .then(function(){ writing=false; if(dirty) flush(); });
}
function adopt(d){
  if(d&&d.v===1&&(d.t||0)>(S.t||0)){ S=norm(JSON.parse(JSON.stringify(d))); keepLocal(); renderAll(); return true; }
  return false;
}
/* Hosted copy: progress lives in Netlify Blobs behind a small function. */
function apiPull(){
  return fetch(API.url,{headers:{authorization:API.auth},cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ if(!adopt(d)&&(S.t||0)>((d&&d.t)||0)) queueRemote(); if(!dirty&&!writing) setSync("Saved"); });
}
function initRemote(){
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("db").then(function(db){
      if(!db){ setSync("Saved in this browser only"); return; }
      ref=db.doc("plan/progress");
      writer=function(o){ return ref.set(o); };
      var to=setTimeout(function(){ setSync("Online save not reachable yet"); },10000);
      ref.onSnapshot(function(snap){
        var md=snap.metadata||{};
        if(md.hasPendingWrites) return;
        if(!md.fromCache) clearTimeout(to);
        var d=snap.exists?snap.data():null;
        if(!adopt(d)&&!md.fromCache&&(S.t||0)>((d&&d.t)||0)) queueRemote();
        if(!md.fromCache&&!dirty&&!writing) setSync("Saved");
      },function(){ clearTimeout(to); writer=null; setSync("Saved in this browser only"); });
    },function(){ setSync("Saved in this browser only"); });
  } else if(API){
    writer=function(o){
      return fetch(API.url,{method:"PUT",headers:{authorization:API.auth,"content-type":"application/json"},body:JSON.stringify(o)})
        .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); });
    };
    apiPull().catch(function(){ setSync("Saved in this browser only"); });
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="visible"&&!dirty&&!writing) apiPull().catch(function(){});
    });
  } else { setSync("Offline copy"); }
}

/* ---------- helpers ---------- */
function esc(x){ return String(x).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function mid(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function add(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function diff(a,b){ return Math.round((mid(a)-mid(b))/DAY); }
function iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function fromIso(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function dm(d){ return d.getDate()+" "+MON[d.getMonth()]; }
function range(a,b){ return a.getMonth()===b.getMonth()? a.getDate()+"–"+b.getDate()+" "+MON[b.getMonth()] : dm(a)+"–"+dm(b); }
function arr(o,k,n){ if(!Array.isArray(o[k])||o[k].length!==n){ o[k]=[]; for(var i=0;i<n;i++) o[k].push(0); } return o[k]; }
function count(o,pred){ var c=0; for(var k in o){ if(Array.isArray(o[k])) o[k].forEach(function(v){ if(pred(v)) c++; }); } return c; }
var GLYPH=["","●","◐","–"];
var STATE=["not done","full session","15-minute session","skipped, not repaid"];
function cellBtn(kind,key,i,v,label,isToday){
  return '<span class="cellwrap"><span>'+label+'</span><button type="button" class="cell s'+v+(isToday?' today':'')+'" data-act="cell" data-kind="'+kind+'" data-key="'+key+'" data-i="'+i+'" aria-label="'+esc(label)+': '+STATE[v]+'">'+GLYPH[v]+'</button></span>';
}
function today(){ return mid(new Date()); }
function where(){
  var d=diff(today(),P1);
  if(d<0) return {ph:"pre",d:d};
  if(d<98) return {ph:"p1",d:d,w:Math.floor(d/7),dow:d%7};
  if(d<105) return {ph:"rec",d:d};
  var e=d-105;
  if(e<168) return {ph:"p2",d:d,c:Math.floor(e/14),cd:e%14};
  return {ph:"post",d:d};
}
