<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#915EFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cea8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f272c8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0a" stroke="url(#grad1)" stroke-width="2"/>

  <!-- Glowing arc reactor circle -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#00cea8" stroke-width="2" filter="url(#glow)" opacity="0.6"/>
  <circle cx="50" cy="50" r="10" fill="none" stroke="#00cea8" stroke-width="1.5" filter="url(#glow)"/>

  <!-- BM text -->
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="bold"
        fill="url(#grad1)" text-anchor="middle" filter="url(#glow)">BM</text>
</svg>
